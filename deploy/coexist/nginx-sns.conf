# 既存の nginx に追加するサイト設定の例（sns.example.jp を実際のサブドメインに置き換える）
# 配置例: /etc/nginx/sites-available/sns.conf → sites-enabled にリンク → nginx -t → reload
# 証明書は既存と同じ方法（certbot など）で取得する:
#   sudo certbot --nginx -d sns.example.jp
server {
    listen 80;
    server_name sns.example.jp;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sns.example.jp;

    ssl_certificate     /etc/letsencrypt/live/sns.example.jp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sns.example.jp/privkey.pem;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8010;
        # ダッシュボードの CSRF 対策（Origin と Host の照合）に必要
        proxy_set_header Host $host;
        # ログイン試行制限に使う接続元IP（アプリは末尾の値を使う）
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
