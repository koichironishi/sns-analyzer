# 既存のサーバー（MEO など）と同居させる構成
# - Caddy は含めない（既存の nginx / Caddy が HTTPS を担当する）
# - ダッシュボードはサーバー内部（127.0.0.1）からのみ接続できるポートで待ち受ける
#
# 使い方（このリポジトリの最上位フォルダで）:
#   docker compose -f deploy/coexist/docker-compose.yml up -d --build
name: sns-analyzer

services:
  app:
    build: ../..
    restart: unless-stopped
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - ../../data:/data
    ports:
      # 外部には公開しない。既存の Web サーバーからだけ接続する
      - "127.0.0.1:${SNS_PORT:-8010}:8000"
    mem_limit: 512m

  scheduler:
    build: ../..
    restart: unless-stopped
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - COLLECT_AT=${COLLECT_AT:-09:00}
      - SYNC_X_DELETIONS=${SYNC_X_DELETIONS:-1}
    volumes:
      - ../../data:/data
    mem_limit: 512m
    command: >
      sh -c 'while true; do
        now=$$(date +%s); at=$$(date -d "$${COLLECT_AT:-09:00}" +%s);
        [ $$at -le $$now ] && at=$$((at + 86400));
        sleep $$((at - now));
        python -m snsanalyzer --config /data/config.json collect --all-clients;
        python -m snsanalyzer --config /data/config.json report --all-clients;
        [ "$${SYNC_X_DELETIONS:-1}" = "1" ] && python -m snsanalyzer --config /data/config.json sync-deletions --all-clients;
      done'
